[project]
name = "next-whistle-shared"
version = "0.1.0"
description = "Versioned contracts and deterministic domain types shared by Next Whistle services"
requires-python = ">=3.12,<3.15"
dependencies = ["pydantic>=2.10,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/next_whistle_shared"]
