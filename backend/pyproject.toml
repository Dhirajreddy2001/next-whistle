[project]
name = "next-whistle-backend"
version = "0.1.0"
description = "Football Match Companion API"
requires-python = ">=3.12,<3.15"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
