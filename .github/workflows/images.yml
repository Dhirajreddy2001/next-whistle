name: Build images

# Builds the Core and Agent images and publishes them to GitHub Container Registry (no Azure registry needed).
# The packages must be set to public once (GitHub > Packages > Package settings) so Azure can pull them without credentials.
on:
  push:
    branches: [main]
    paths: [backend/**, data/datasets/**, data/rules/**, infra/docker/**, .dockerignore, .github/workflows/images.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: core, dockerfile: infra/docker/core.Dockerfile }
          - { name: agent, dockerfile: infra/docker/agent.Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/next-whistle-${{ matrix.name }}
          tags: |
            type=raw,value=latest
            type=sha
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: echo "ghcr.io/${{ github.repository_owner }}/next-whistle-${{ matrix.name }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
